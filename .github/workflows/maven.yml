name: Java CI with Maven

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: '0 13 * * 1'

jobs:
  build_and_test:
    name: 🧪 Build & Test in Docker
    runs-on: ubuntu-latest

    steps:
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4

      - name: ⚡ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build SOLO la etapa builder (ahí corren tests y se genera allure:report)
      - name: 🏗️ Build builder stage (runs tests + report)
        run: docker build --target builder -t javaconversationproject-builder .

      # Extrae artefactos desde el contenedor SIEMPRE
      - name: 📤 Extract test reports + allure from container
        if: always()
        run: |
          docker create --name tmp javaconversationproject-builder

          # JUnit/Surefire reports
          docker cp tmp:/app/target/surefire-reports ./surefire-reports || true

          # Allure raw results (clave para debug si el HTML sale vacío)
          docker cp tmp:/app/target/allure-results ./allure-results || true

          # Allure HTML report (generado por mvn allure:report)
          docker cp tmp:/app/target/site/allure-maven-plugin ./allure-report || true

          docker rm -f tmp

      - name: 📦 Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: surefire-reports

      - name: 📦 Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
