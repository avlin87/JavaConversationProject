name: Java CI with Maven

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: '0 13 * * 1'

jobs:
  build_and_test:
    name: 🧪 Build & Test in Docker
    runs-on: ubuntu-latest

    steps:
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4

      - name: ⚡ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1) Build SOLO la etapa builder (ahí corren tests y se genera Allure)
      - name: 🏗️ Build builder stage (runs tests)
        run: docker build --target builder -t javaconversationproject-builder .

      # 2) Extraer artefactos desde el contenedor
      - name: 📤 Extract surefire + allure report from container
        if: always()
        run: |
          docker create --name tmp javaconversationproject-builder
          docker cp tmp:/app/target/surefire-reports ./surefire-reports || true
          docker cp tmp:/app/target/site/allure-maven-plugin ./allure-report || true
          docker rm -f tmp

      - name: 📦 Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: surefire-reports

      - name: 📦 Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
